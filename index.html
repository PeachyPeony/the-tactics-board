<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Tactics Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header class="site-header">
        <div class="container header-content">
            <a href="#" class="logo">
                THE TACTICS BOARD
            </a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="#formations">Formations</a>
                <a href="#concepts">Tactical Concepts</a>
            </nav>

        </div>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="container hero-content">
                <p class="eyebrow">FOOTBALL TACTICS LIBRARY</p>

                <h1>
                    Understand the game beyond the ball.
                </h1>

                <p class="hero-description">
                    Explore football formations, tactical systems
                    and the ideas behind them.
                </p>
                <button type="button" id="random-button" class="button button-primary">
                    Surprise Me</button>
            </div>
        </section>

        <!-- Formation Library -->
        <section id="formations" class="formations-section">
            <div class="container">
                <div class="section-heading">
                    <p class="eyebrow">EXPLORE</p>
                    <h2>Formation Library</h2>
                    <p>Explore different football formations
                        and discover their strengths and weaknesses</p>
                </div>

                <!-- Filters and sorting -->
                <div class="controls">
                    <div class="filter-group">
                        <label for="type-filter">
                            Type
                        </label>
                        <select id="type-filter">
                            <option value="all">All</option>
                            <option value="Formation">Formations</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="style-filter">
                            Style
                        </label>
                        <select id="style-filter">
                            <option value="all">All styles</option>
                            <option value="Possession">Possession</option>
                            <option value="Balanced">Balanced</option>
                            <option value="Counter-attacking">Counter-attacking</option>
                            <option value="Defensive">Defensive</option>
                            <option value="Attacking">Attacking</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="sort-select">
                            Sort by
                        </label>
                        <select id="sort-select">
                            <option value="name-asc">
                                Name: A → Z
                            </option>
                            <option value="name-desc">
                                Name: Z → A
                            </option>
                            <option value="attacking-desc">
                                Attacking: High → Low
                            </option>
                            <option value="defending-desc">
                                Defending: High → Low
                            </option>
                            <option value="difficulty-asc">
                                Difficulty: Easy → Hard
                            </option>
                            <option value="difficulty-desc">
                                Difficulty: Hard → Easy
                            </option>
                        </select>
                    </div>
                </div>
                <!-- Formation cards will be generated by JavaScript -->
                <div id="formation-grid" class="formation-grid">
                </div>
        </section>
    </main>
</body>
